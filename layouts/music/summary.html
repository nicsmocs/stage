    {{ $author := .Params.author }}
    <section class="summary">
      {{ with .Params.album.image }}<img src="{{ . | relURL }}" alt="{{ $.Title }}" class="avatar">{{ end }}
        <div class="content">
            <h4 class="title"><a href="{{ .RelPermalink }}" rel="prefetch">{{ .Title }}</a></h4>
          {{ with .Description }}<h5 class="subtitle">{{ . }}</h5>{{ end }}
          <div class="meta">
          {{ range $element := .Site.Params.authors }}
            {{ if eq $element.name $author }}
            Written By <a href="{{ $element.link }}"><address>{{ $element.name }}</address></a> &mdash;
            {{ end }}
          {{ end }}
            <time pubdate datetime="{{ .Date.Format "2006-01-02" }}" title="{{ .Date.Format "2006" }}">{{ .Date.Format "2006" }}</time>
          </div>
        </div>
        <hr />
    </section>
