<section class="summary">
  <div class="content">
    {{ with .Params.event_date }}
      <h4 class="title"><a href="{{ $.RelPermalink }}" rel="prefetch">{{ if eq $.Site.Language.Lang "en" }}{{ time.Format "January 2, 2006" . }}{{ else }}{{ time.Format "02.01.2006" . }}{{ end }}: {{ $.Title }}</a></h4>
    {{ end }}
  </div>
  <hr />
</section>
